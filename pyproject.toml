[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ramordcast"
version = "1.0.0"
authors = [
  { name="ramordcommunity", email="ramordser@users.noreply.github.com" },
]
description = "Ultra-Low Latency Screen Mirroring & Dual-Display Solution for Samsung Tizen Smart TVs & Monitors on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: GTK",
]
dependencies = [
    "PyGObject>=3.42.0",
    "requests>=2.28.0",
]

[project.scripts]
ramordcast = "main:main"
